apiVersion: 1

groups:
  - orgId: 1
    name: bike-sharing-ml-alerts
    folder: Bike Sharing
    interval: 1m
    rules:
      - uid: bike-drift-detected
        title: Bike Sharing input drift detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: evidently_data_drift_detected_status
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        dashboardUid: model-performance-drift
        panelId: 5
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Evidently detected drift in the Bike Sharing input features.
          description: Run make evaluation after investigating this alert to refresh the drift score.
        labels:
          severity: warning
          team: ml
